name: Toolbox
options:
  bundleIdPrefix: com.dobbs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.3
  RoyalVNCKit:
    url: https://github.com/royalapplications/royalvnc
    revision: 92d4427c73817d8f849bb289ff190aa4b40c44ea

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Toolbox:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: SwiftTerm
      - package: RoyalVNCKit
    info:
      path: Info.plist
      properties:
        CFBundleName: Toolbox
        CFBundleDisplayName: Toolbox
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dobbs.Toolbox
        PRODUCT_NAME: Toolbox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Rust core: produced by bridge/build-core.sh
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/ToolboxCoreFFI
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor
        OTHER_LDFLAGS: ["-ltoolbox_core", "-framework", "Security", "-framework", "SystemConfiguration", "-framework", "CoreFoundation"]
