[package]
name = "toolbox-core"
version = "0.1.0"
edition = "2021"
description = "Connection engine for Toolbox: SSH, SFTP, FTP, VNC, vault and providers"
license = "MIT"

[lib]
name = "toolbox_core"
# cdylib for the app (C# loads toolbox_core.dll), rlib for tests and examples.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[[example]]
name = "echo_server"
required-features = ["test-support"]

[[example]]
name = "ftp_server"
required-features = ["test-support"]

[[test]]
name = "ftp"
required-features = ["test-support"]

[[test]]
name = "sftp"
required-features = ["test-support"]

[features]
default = []
cli = ["uniffi/cli"]
# In-process SSH/SFTP and FTP servers for tests and the examples.
test-support = ["dep:rcgen", "dep:async-trait", "dep:tempfile", "dep:libunftp", "dep:unftp-sbe-fs", "dep:unftp-core"]

[dependencies]
uniffi = { version = "0.32", features = ["tokio"] }
russh = "0.65"
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
ldap3 = { version = "0.12", default-features = false, features = ["tls-native"] }
chacha20poly1305 = "0.10"
zeroize = "1"
base64 = "0.22"
rand = "0.10"
# Self-signed certificates for the FTPS test server.
rcgen = { version = "0.14", optional = true }
tempfile = { version = "3", optional = true }
async-trait = { version = "0.1", optional = true }
bytes = "1"
# FTP and explicit FTPS for File Transfer connections.
suppaftp = { version = "12", features = ["tokio-async-native-tls"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
# In-process FTP server for tests and the `ftp_server` example.
libunftp = { version = "0.25", optional = true }
unftp-sbe-fs = { version = "0.4", optional = true }
unftp-core = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"
rand = "0.10"
