<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Everything is local: no network, no inline script. xterm.js writes its
     own style elements, hence 'unsafe-inline' for styles only. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>Toolbox terminal</title>
<link rel="stylesheet" href="xterm/xterm.css">
<link rel="stylesheet" href="terminal.css">
</head>
<body>
<div id="terminal"></div>
<!-- Find in the terminal's text and scrollback (Ctrl+Shift+F). -->
<div id="find" hidden>
  <input id="find-text" type="text" spellcheck="false" autocomplete="off" placeholder="Find" aria-label="Find">
  <span id="find-count" aria-live="polite"></span>
  <button id="find-previous" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match">&#x2191;</button>
  <button id="find-next" type="button" title="Next match (Enter)" aria-label="Next match">&#x2193;</button>
  <button id="find-close" type="button" title="Close (Esc)" aria-label="Close">&#x2715;</button>
</div>
<script src="xterm/xterm.js"></script>
<script src="xterm/addon-fit.js"></script>
<script src="xterm/addon-web-links.js"></script>
<script src="xterm/addon-webgl.js"></script>
<script src="xterm/addon-search.js"></script>
<script src="terminal.js"></script>
</body>
</html>
